name: Feature request
description: Propose a narrow, explainable local check or report improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: boundary
    attributes:
      label: Release-boundary problem
      description: What local fact is currently missed?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed evidence and false-positive controls
      description: Explain path/line evidence, severity, remediation, and synthetic proof.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and alternatives
      description: Explain why existing local tools or a documentation change are insufficient.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Acceptance criteria and test plan
      description: List observable completion conditions and the smallest synthetic fixture that proves them.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Contribution intent
      options:
        - I can open a pull request after design agreement
        - I can help test or review
        - I am proposing the idea only
    validations:
      required: true
  - type: checkboxes
    id: cleanroom
    attributes:
      label: Clean-room confirmation
      options:
        - label: This proposal contains only public specifications and synthetic examples.
          required: true
